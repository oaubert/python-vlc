name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends vlc pulseaudio libvlc-dev
          pulseaudio --start
          bash ./dev_setup.sh
          . .venv/bin/activate
          make test_generator
          make test_bindings
